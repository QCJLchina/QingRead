name: Release

# push v* tag -> 构建 Windows 版 qingread.exe 与 NSIS 安装器 -> 创建 draft release 并上传产物。
# workflow_dispatch 供手动验证构建（不发 release，产物留 artifact 供下载检查）。
# 本流程不需要任何 Secrets：产物未做代码签名。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # 取完整历史与全部 tag：便于后面读取 annotated tag 的说明作为 release notes
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 测试脚本用 node --test 直接跑 .ts，依赖 Node 22.18+ 的原生类型擦除，
      # 因此固定 24，而不是 runner 默认的 20。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # package.json 与 tauri.conf.json 必须一致，否则安装器文件名与产物会对不上
      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($pkg -ne $conf) { throw "version mismatch: package.json=$pkg tauri.conf.json=$conf" }
          if ($pkg -notmatch '^[0-9]+[.][0-9]+[.][0-9]+$') { throw "unexpected version format: $pkg" }
          # PS 5.1 的 Out-File 默认 UTF-16 会写坏 GITHUB_OUTPUT，显式用 ascii
          Add-Content $env:GITHUB_OUTPUT "app=$pkg" -Encoding ascii

      # 版本一致性：tag v3.0.0 <-> 应用版本 3.0.0，防止发错版本
      - name: Check tag matches version
        if: github.event_name == 'push'
        env:
          APP_VERSION: ${{ steps.version.outputs.app }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($tag -ne $env:APP_VERSION) {
            throw "tag v$tag != app version $($env:APP_VERSION) (bump the version before tagging)"
          }

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build (frontend + Rust release + NSIS)
        run: npm run tauri build

      # 构建产物改名成带版本号的形式，release 页面上能直接看出是哪个版本
      - name: Collect release assets
        env:
          APP_VERSION: ${{ steps.version.outputs.app }}
        shell: pwsh
        run: |
          $version = $env:APP_VERSION
          $exe = 'src-tauri/target/release/qingread.exe'
          $setup = "src-tauri/target/release/bundle/nsis/QingRead_${version}_x64-setup.exe"
          foreach ($file in @($exe, $setup)) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "build artifact missing: $file" }
            if ((Get-Item -LiteralPath $file).Length -eq 0) { throw "build artifact empty: $file" }
          }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          # 绿色版打成 zip：压缩包内是 qingread.exe，解压即用
          $portableDir = "release-assets/_portable"
          if (Test-Path -LiteralPath $portableDir) { Remove-Item -LiteralPath $portableDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $portableDir "qingread.exe")
          Compress-Archive -LiteralPath (Join-Path $portableDir "qingread.exe") `
            -DestinationPath "release-assets/QingRead_${version}_x64-portable.zip" -Force
          Remove-Item -LiteralPath $portableDir -Recurse -Force
          Copy-Item -LiteralPath $setup -Destination (Join-Path 'release-assets' (Split-Path $setup -Leaf))
          Get-ChildItem -LiteralPath release-assets | Select-Object Name, Length

      # dispatch 干跑不发 release，产物留 artifact 供下载检查
      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: QingRead-${{ steps.version.outputs.app }}
          path: |
            release-assets/QingRead_${{ steps.version.outputs.app }}_x64-portable.zip
            release-assets/QingRead_${{ steps.version.outputs.app }}_x64-setup.exe
          retention-days: 14

      # draft：上传产物后在网页上补 release notes 再手动 Publish
      - name: Create draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ steps.version.outputs.app }}
        shell: pwsh
        run: |
          $version = $env:APP_VERSION
          $tag = $env:RELEASE_TAG
          $assets = @(
            "release-assets/QingRead_${version}_x64-portable.zip",
            "release-assets/QingRead_${version}_x64-setup.exe"
          )
          foreach ($asset in $assets) {
            if (!(Test-Path -LiteralPath $asset -PathType Leaf) -or (Get-Item -LiteralPath $asset).Length -eq 0) {
              throw "release asset missing or empty: $asset"
            }
          }
          # 只清理同名 draft；绝不删除已发布的 release 或 tag
          $json = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to list releases' }
          $releases = @($json | ConvertFrom-Json | ForEach-Object { $_ } | Where-Object { $_.tag_name -ceq $tag })
          if (@($releases | Where-Object { !$_.draft }).Count -gt 0) {
            throw "Release $tag is already published"
          }
          foreach ($release in $releases) {
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)"
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete draft release $($release.id)" }
          }
          # 初稿用 annotated tag 的说明（release notes 写在 tag message 里）；不用 --generate-notes
          $body = git tag -l --format='%(contents)' $tag
          if ([string]::IsNullOrWhiteSpace(($body -join "`n"))) { $body = $tag }
          gh release create $tag --draft --verify-tag --title $tag --notes ($body -join "`n") @assets
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft release with assets' }
